<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishu's Portfolio</title>
    <link rel="stylesheet" href="style.css?v=5.5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background">
        <div class="portfolio-text">
            <span>welcome to my</span>
            <p>
                <span class="letter">P</span><span class="letter">o</span><span class="letter">r</span><span class="letter">t</span><span class="letter">f</span><span class="letter">o</span><span class="letter">l</span><span class="letter">i</span><span class="letter">o</span>
            </p>
        </div>
        <div class="sticky-note">
            <p><strong>$To do:</strong></p>
            <ul>
                <li>Land my dream UX job</li>
                <li>Drink water</li>
                <li>Move to the US</li>
                <li>Finish grad school</li>
                <li>Build that banger spotify playlist</li>
                <li>World domination</li>
            </ul>
        </div>
    </div>

    <div class="window" style="display: none;">
        <div class="window-header">
            <div class="window-controls">
                <button class="window-btn close" aria-label="Close"></button>
                <button class="window-btn minimize" aria-label="Minimize"></button>
                <button class="window-btn fullscreen" aria-label="Enter Full Screen"></button>
            </div>
            <div class="window-title"></div>
        </div>
        <div class="window-body"></div>
    </div>

    <div class="dock"></div>

    <script src="script.js"></script>
</body>

</html>
